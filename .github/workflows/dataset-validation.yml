name: Dataset validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_dataset.py
      - run: pip install -r requirements-ar-tools.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_ar_alignment.py
      - run: python scripts/validate_esp12e_alignment_metadata.py
      - run: python scripts/validate_nxp_video_review.py
      - run: python scripts/validate_physical_view_followup.py
      - run: python scripts/validate_additional_flip_clips.py
