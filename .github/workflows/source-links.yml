name: Source link validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_source_links.py
      - run: python scripts/build_non_nxp_source_pins.py --check
      - run: python scripts/build_label_hierarchy.py --check
      - run: python scripts/validate_nxp_j12_review.py
      - run: python scripts/validate_generated_cad.py
      - run: python scripts/validate_pcbvision_rgb.py
